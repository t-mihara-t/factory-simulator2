<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173c40"><title>RAILWORKS YARD — Factory Simulator 2</title><meta name="description" content="受注伝票・材料調達・着工予約で工場を動かす鉄道車両工場ゲーム。体験チュートリアル、並列編成、工場出荷と資金の判断。"><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css"></head>
<body>
<div id="game">
 <header class="topbar" aria-label="経営状況"><div class="stat"><span>現金残高</span><strong id="cash">18,000 <small>G</small></strong></div><div class="stat"><span>出荷量</span><strong id="delivered">0 <small>両</small></strong></div><button class="funds-shortcut" data-panel="finance"><span>追加投資の目安</span><b id="available-cash"></b></button><div class="streak-stat"><span>納期内連続</span><b id="streak">0</b></div></header>
 <section id="live-strip" aria-label="工程と出荷の状況"></section>
 <section id="director" aria-label="次の操作の案内"></section>
 <main id="workspace">
  <nav class="quickbar" aria-label="情報の折りたたみ"><button data-inspector="mission" aria-expanded="false">目標 <span id="goal-badge"></span></button><button data-inspector="events" aria-expanded="false">通知 <span id="event-count"></span></button><button data-inspector="map" aria-expanded="false">全域</button><div class="map-tools"><button id="zoom-out" aria-label="縮小">−</button><span id="zoom-level">100%</span><button id="zoom-in" aria-label="拡大">＋</button><button id="recenter" aria-label="工場中心へ戻る">⌖</button><button id="heatmap" aria-label="混雑の色分け">◉</button></div></nav>
  <div id="map-wrap"><canvas id="world" aria-label="工場マップ。ドラッグで移動、ピンチで拡大縮小。設備一覧からも選択できます" tabindex="0"></canvas><div id="build-hint" class="build-hint" hidden></div></div>
  <aside id="inspector" hidden aria-label="折りたたみ情報"><button id="fold-info" class="fold-button">情報を閉じる ×</button><section class="mission" data-info="mission" hidden><div class="panel-kicker"><span id="chapter">CHAPTER 01</span><button id="scenarios" class="text-button">シナリオ</button></div><h2 id="mission-title"></h2><div id="mission-goals"></div><button id="mission-action" class="primary full"></button></section><section data-info="events" hidden><h2>工場の出来事</h2><div id="event-list"></div><button data-panel="events" class="secondary full">履歴をすべて見る</button></section><section data-info="map" hidden><h2>工場全域</h2><canvas id="minimap" width="280" height="180" aria-label="全域地図。タップした場所へ移動"></canvas><p>地図をタップして移動。38 × 30マス</p></section><div id="context-panel" data-info="facility" hidden></div></aside>
  <div class="timeline"><button id="play" class="primary">▶ 操業開始</button><div class="clock"><b id="game-date">DAY 01 · 08:00</b><small id="run-state">一時停止中</small></div><button id="next-change" class="secondary">次の変化まで ≫</button><div class="speeds" aria-label="ゲーム速度"><button data-speed="1" class="active">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button></div></div>
  <nav class="dock" aria-label="工場管理"><button data-panel="layout"><span>▦</span>編成</button><button data-panel="build"><span>＋</span>建設</button><button data-panel="staff"><span>♙</span>人員</button><button data-panel="orders"><span>▤</span>受注<span id="order-badge" class="badge">3</span></button><button data-panel="flow"><span>▥</span>生産管理</button><button data-panel="finance"><span>◈</span>お金</button><button id="settings" aria-label="設定と保存"><span>⚙</span>設定</button></nav>
  <aside id="toast" class="toast" role="status" aria-live="polite" hidden></aside>
 </main>
</div>
<dialog id="modal"><div class="modal-head"><div><span class="eyebrow" id="modal-eyebrow">操業を一時停止中</span><h2 id="modal-title"></h2></div><button class="icon-button" id="close-modal" aria-label="工場へ戻る">×</button></div><nav id="modal-tabs" class="management-tabs" role="tablist" aria-label="工場全体の調整"></nav><div id="modal-funds" class="modal-funds"></div><p id="modal-message" role="status" aria-live="polite" hidden></p><div id="modal-body" role="tabpanel" tabindex="0"></div></dialog>
<script src="catalog.js"></script><script src="music.js"></script><script src="audio.js"></script><script src="simulation.js"></script><script src="operations.js"></script><script src="management.js"></script><script src="hud-layout.js"></script><script src="planner.js"></script><script src="world.js"></script><script src="app.js"></script>
</body></html>
